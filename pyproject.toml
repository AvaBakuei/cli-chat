[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-chat"
version = "0.1.0"
description = "A terminal chat client for the OpenAI API"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "prompt_toolkit",
    "openai",
    "python-dotenv",
    "readchar",
]

[project.scripts]
cli-chat = "cli_chat.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
disallow_untyped_defs = true
disallow_incomplete_defs = true